# Fly.io deployment — single instance, persistent volume for SQLite
app = "eto-challenge"
primary_region = "iad"

[build]
  builder = "oven/bun:1"

[env]
  PORT = "3000"
  DB_PATH = "/data/eto-challenge.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "eto_data"
  destination = "/data"
